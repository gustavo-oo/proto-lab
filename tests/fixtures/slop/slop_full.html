<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nimbus</title>
<style>
  body { margin: 0; background: #ffffff; color: #0b0b0b; font-family: Inter; }
  .hero {
    text-align: center;
    padding: 96px 24px;
    background-image: linear-gradient(135deg, #6366f1, #8b5cf6);
  }
  h1 { font-size: 64px; margin: 0 0 16px; }
  .sub { font-size: 20px; color: #334155; }
  .cta {
    display: inline-block;
    margin: 8px;
    padding: 12px 24px;
    border-radius: 12px;
    background: #111111;
    color: #ffffff;
    text-decoration: none;
  }
  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 48px 24px;
  }
  .card {
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 10px rgba(0, 0, 0, .10);
  }
</style>
</head>
<body>
  <section class="hero">
    <h1>Ship your ideas faster</h1>
    <p class="sub">The platform for modern teams.</p>
    <a class="cta" href="#">Get started</a>
    <a class="cta" href="#">Book a demo</a>
  </section>
  <section class="features">
    <div class="card"><h2>Fast</h2><p>Instant builds.</p></div>
    <div class="card"><h2>Simple</h2><p>Clean defaults.</p></div>
    <div class="card"><h2>Scalable</h2><p>Grows with you.</p></div>
  </section>
</body>
</html>
