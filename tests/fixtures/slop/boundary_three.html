<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Process report</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    color: #14100c;
    font-family: Georgia, "Times New Roman", serif;
  }
  .banner {
    background-image: linear-gradient(135deg, #6366f1, #8b5cf6);
    padding: 24px;
  }
  .card { border: 1px solid #e5e0d8; border-radius: 4px; padding: 16px; margin: 12px; }
  .shadow-a { box-shadow: 0 1px 10px rgba(0, 0, 0, .12); }
  .shadow-b { box-shadow: 0 2px 12px rgba(0, 0, 0, .12); }
  .shadow-c { box-shadow: 0 4px 16px rgba(0, 0, 0, .12); }
  .shadow-d { box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
  .shadow-e { box-shadow: 0 3px 14px rgba(0, 0, 0, .12); }
</style>
</head>
<body>
  <div class="banner"><h1>Process report</h1></div>
  <ul class="card list">
    <li>Press check</li>
    <li>Ink limits</li>
    <li>Fold test ✨</li>
  </ul>
  <a class="btn shadow-a" href="#">Download</a>
</body>
</html>
