<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{VARIANT_LABEL}}</title>
<!--
  Variant page shell (scaffolded to prototypes/<slug>-<seed>/variants/<id>-<key>/<screen>.html).
  Neutral until the direction card is injected: the card overrides --accent and
  the font variables below. The generator fills the variant-label token and
  injects the screens at the screens marker; the nav links the screens relatively
  so the mini-project stays navigable from file://.
-->
<style>
  :root {
    --bg: #f5f3ef;
    --panel: #ffffff;
    --ink: #17150f;
    --muted: #6d685c;
    --line: #ddd8ca;
    --accent: #0018a8;
    --font-text: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .topbar__eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .topbar__label { margin: 0; font-size: 15px; font-weight: 600; }
  .nav { display: flex; gap: 4px; margin-left: auto; }
  .nav a {
    padding: 6px 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink);
    border: 1px solid transparent;
    border-radius: 4px;
  }
  .nav a:hover { border-color: var(--line); }
  .nav a[aria-current="page"] { border-color: var(--ink); }
  .stage { flex: 1; padding: 28px 20px; }
</style>
</head>
<body>
  <header class="topbar">
    <span class="topbar__eyebrow">variant</span>
    <h1 class="topbar__label">{{VARIANT_LABEL}}</h1>
    <nav class="nav" aria-label="Variant screens">
      <a href="index.html" aria-current="page">index</a>
      <a href="detail.html">detail</a>
      <a href="form.html">form</a>
    </nav>
  </header>

  <main class="stage">
    <!-- screens -->
  </main>
</body>
</html>
