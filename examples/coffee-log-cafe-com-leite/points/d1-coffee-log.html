<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proto-lab — d1 · como o log de cafés se apresenta</title>
<!--
  Comparison-canvas template (scaffolded to prototypes/<slug>-<seed>/points/<id>-<slug>.html).
  Shows the point's options side by side as live iframes, with a desktop/mobile
  width toggle. The toggle script runs in THIS document only (document.querySelectorAll
  over local iframes) — no cross-frame scripting, so it works from file://.
  The generator fills the title token and replaces the whole deck block below
  (anchored by data-canvas-frames) with the real per-option frames; the sample
  deck is the neutral, pre-generation preview.
-->
<style>
  :root {
    --bg: #f5f3ef;
    --panel: #ffffff;
    --ink: #17150f;
    --muted: #6d685c;
    --line: #ddd8ca;
    --accent: #0018a8;
    --font-text: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .bar {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 2px solid var(--ink);
  }
  .bar__back {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .bar__title { margin: 0; font-size: 16px; font-weight: 600; }
  .bar__widths { display: flex; gap: 6px; margin-left: auto; }
  .bar__widths button {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  .bar__widths button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .deck {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 24px 20px 48px;
    overflow-x: auto;
  }
  .frame {
    flex: 0 0 auto;
    margin: 0;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .frame__caption {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .frame__letter {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--ink);
    border-radius: 4px;
  }
  .frame__desc { color: var(--muted); }
  .frame iframe {
    display: block;
    width: 380px;
    height: 640px;
    border: 0;
    background: #fff;
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="bar__back" href="../index.html">gallery</a>
    <h1 class="bar__title">d1 · como o log de cafés se apresenta</h1>
    <div class="bar__widths" role="group" aria-label="Preview width">
      <button type="button" data-width="1280px" aria-pressed="true">desktop</button>
      <button type="button" data-width="390px" aria-pressed="false">mobile</button>
    </div>
  </header>

  <!--
    Generated canvas for point d1 (listing-pattern): the whole deck block below
    replaced the template's sample deck (ruling R16). Frames are relative and
    lazy; nothing here scripts across frames, so it opens straight from file://.
  -->
    <div class="deck" data-canvas-frames="d1-a d1-b d1-c">
    <figure class="frame" data-variant="a">
      <figcaption class="frame__caption">
        <span class="frame__letter">A</span>
        <span class="frame__desc">option a — tabela densa: grade alinhada por colunas</span>
      </figcaption>
      <iframe loading="lazy" src="../variants/d1-a/index.html" title="Variante A — tabela densa"></iframe>
    </figure>
    <figure class="frame" data-variant="b">
      <figcaption class="frame__caption">
        <span class="frame__letter">B</span>
        <span class="frame__desc">option b — grade de cartões: um cartão por café</span>
      </figcaption>
      <iframe loading="lazy" src="../variants/d1-b/index.html" title="Variante B — grade de cartões"></iframe>
    </figure>
    <figure class="frame" data-variant="c">
      <figcaption class="frame__caption">
        <span class="frame__letter">C</span>
        <span class="frame__desc">option c — feed de coluna única: uma entrada por linha</span>
      </figcaption>
      <iframe loading="lazy" src="../variants/d1-c/index.html" title="Variante C — feed de coluna única"></iframe>
    </figure>
  </div>

  <script>
    (function () {
      var frames = document.querySelectorAll('.deck iframe');
      var buttons = document.querySelectorAll('[data-width]');
      Array.prototype.forEach.call(buttons, function (button) {
        button.addEventListener('click', function () {
          var width = button.getAttribute('data-width');
          Array.prototype.forEach.call(frames, function (frame) {
            frame.style.width = width;
          });
          Array.prototype.forEach.call(buttons, function (other) {
            other.setAttribute('aria-pressed', String(other === button));
          });
        });
      });
    }());
  </script>
</body>
</html>
